[package]
name = "image-annotation"
version = "0.1.0"
description = "A professional image annotation desktop client"
authors = ["Image Annotation"]
edition = "2021"

[lib]
name = "image_annotation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip", "brotli", "zstd", "deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2.5"
zip = "2.2"
quick-xml = { version = "0.39", features = ["serialize"] }
rfd = "0.15"
keyring = { version = "4.1.5", features = ["v1"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
window-vibrancy = "0.7.1"

[target.'cfg(target_os = "linux")'.dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "protocol-asset"] }
window-vibrancy = "0.7.1"
objc2-app-kit = { version = "0.3.2", features = ["NSView", "NSWindow", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3.2", features = ["CALayer"] }

[target.'cfg(not(mobile))'.dependencies]
tauri-plugin-single-instance = "2.4.1"
