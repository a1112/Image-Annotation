[package]
name = "image-annotation"
version = "0.1.0"
description = "A professional image annotation desktop client"
authors = ["Image Annotation"]
edition = "2021"

[lib]
name = "image_annotation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
monitor-sysinfo = { package = "sysinfo", version = "0.33", default-features = false, features = ["system"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
base64 = "0.22"
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip", "brotli", "zstd", "deflate"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
walkdir = "2.5"
zip = "9.0.5"
quick-xml = { version = "0.41.0", features = ["serialize"] }
sha2 = "0.10"
uuid = { version = "1.23.1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
window-vibrancy = "0.7.1"

[target.'cfg(target_os = "linux")'.dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "protocol-asset"] }
window-vibrancy = "0.7.1"
objc2-app-kit = { version = "0.3.2", features = ["NSView", "NSWindow", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3.2", features = ["CALayer"] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0.1", features = ["protected"] }
keyring-core = "1"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"
keyring-core = "1"

[target.'cfg(not(mobile))'.dependencies]
tauri-plugin-single-instance = "2.4.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "4.1.5", features = ["v1"] }
rfd = "0.15"
