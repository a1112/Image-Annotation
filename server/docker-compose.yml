name: image-annotation-hybrid

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-image_annotation}
      POSTGRES_USER: ${POSTGRES_USER:-image_annotation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-image_annotation_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-image_annotation}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-image_annotation_dev_secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      interval: 5s
      timeout: 3s
      retries: 20

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000
        "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-image_annotation}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-image_annotation_dev_secret}
      S3_BUCKET: ${S3_BUCKET:-image-annotation}

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      SERVER_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://${POSTGRES_USER:-image_annotation}:${POSTGRES_PASSWORD:-image_annotation_dev}@postgres:5432/${POSTGRES_DB:-image_annotation}
      JWT_SECRET: ${JWT_SECRET:-replace-this-development-secret}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-image-annotation}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-image_annotation}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-image_annotation_dev_secret}
      AWS_ENDPOINT_URL_S3: http://minio:9000
      AWS_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-image_annotation}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-image_annotation_dev_secret}
      RUST_LOG: ${RUST_LOG:-image_annotation_server=info,tower_http=info}
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  postgres-data:
  minio-data:
