openapi: 3.1.0
info:
  title: Image Annotation Hybrid Project API
  version: 1.0.0
  description: |
    Remote API for hybrid image-annotation projects. Mutating requests are
    authenticated, authorized per project, audited, and exposed through the
    incremental change stream.
servers:
  - url: http://127.0.0.1:8080
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Projects
  - name: Assets
  - name: Annotations
  - name: Issues
  - name: Sync
paths:
  /health:
    get:
      tags: [System]
      security: []
      operationId: health
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
  /api/v1/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      responses:
        "200":
          description: Projects visible to the current user
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Projects]
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectWrite"
      responses:
        "200":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      operationId: getProject
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [Projects]
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectWrite"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Projects]
      operationId: deleteProject
      responses:
        "204":
          description: Project soft-deleted
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      operationId: listProjectMembers
      responses:
        "200":
          description: Project members
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectMember"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Projects]
      operationId: addProjectMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, role]
              properties:
                userId:
                  type: string
                  format: uuid
                role:
                  $ref: "#/components/schemas/ProjectRole"
      responses:
        "200":
          description: Added or updated member
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}/images:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: cursor
        in: query
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
    get:
      tags: [Assets]
      operationId: listImages
      responses:
        "200":
          description: Cursor page of project images
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Asset"
                  nextCursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}/assets/upload-session:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Assets]
      operationId: createAssetUploadSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUploadRequest"
      responses:
        "200":
          description: Presigned object upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}/assets/{assetId}/complete:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AssetId"
    post:
      tags: [Assets]
      operationId: completeAssetUpload
      responses:
        "200":
          description: Verified ready asset
        default:
          $ref: "#/components/responses/Error"
  /api/v1/assets/{assetId}/download-url:
    parameters:
      - $ref: "#/components/parameters/AssetId"
    get:
      tags: [Assets]
      operationId: getAssetDownloadUrl
      responses:
        "200":
          description: Short-lived asset download URL and integrity metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadTicket"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}/images/{imageId}/annotation:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ImageId"
    get:
      tags: [Annotations]
      operationId: getAnnotation
      responses:
        "200":
          description: Current annotation
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [Annotations]
      operationId: putAnnotation
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnotationWrite"
      responses:
        "200":
          description: Saved annotation revision
        "409":
          description: Base revision conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}/images/{imageId}/annotation/versions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ImageId"
    get:
      tags: [Annotations]
      operationId: listAnnotationVersions
      responses:
        "200":
          description: Immutable annotation revision history
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}/images/{imageId}/submit:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ImageId"
    post:
      tags: [Annotations]
      operationId: submitAnnotation
      responses:
        "200":
          description: Annotation submitted for review
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}/images/{imageId}/lease:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ImageId"
    post:
      tags: [Annotations]
      operationId: acquireAnnotationLease
      responses:
        "200":
          description: Lease acquired or renewed
        "409":
          description: Image is leased by another user
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Annotations]
      operationId: releaseAnnotationLease
      responses:
        "204":
          description: Lease released
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}/issues:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Issues]
      operationId: listIssues
      responses:
        "200":
          description: Project issues
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Issues]
      operationId: createIssue
      responses:
        "200":
          description: Created issue
        default:
          $ref: "#/components/responses/Error"
  /api/v1/issues/{issueId}:
    parameters:
      - $ref: "#/components/parameters/IssueId"
    get:
      tags: [Issues]
      operationId: getIssue
      responses:
        "200":
          description: Issue detail
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [Issues]
      operationId: updateIssue
      responses:
        "200":
          description: Updated issue
        default:
          $ref: "#/components/responses/Error"
  /api/v1/issues/{issueId}/transition:
    parameters:
      - $ref: "#/components/parameters/IssueId"
    post:
      tags: [Issues]
      operationId: transitionIssue
      responses:
        "200":
          description: Transitioned issue
        default:
          $ref: "#/components/responses/Error"
  /api/v1/issues/{issueId}/comments:
    parameters:
      - $ref: "#/components/parameters/IssueId"
    post:
      tags: [Issues]
      operationId: addIssueComment
      responses:
        "200":
          description: Added comment
        default:
          $ref: "#/components/responses/Error"
  /api/v1/issues/{issueId}/attachments:
    parameters:
      - $ref: "#/components/parameters/IssueId"
    get:
      tags: [Issues]
      operationId: listIssueAttachments
      responses:
        "200":
          description: Issue attachments
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Issues]
      operationId: createIssueAttachmentUploadSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentUploadRequest"
      responses:
        "200":
          description: Presigned attachment upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/issues/{issueId}/attachments/{attachmentId}/complete:
    parameters:
      - $ref: "#/components/parameters/IssueId"
      - $ref: "#/components/parameters/AttachmentId"
    post:
      tags: [Issues]
      operationId: completeIssueAttachmentUpload
      responses:
        "200":
          description: Verified ready attachment
        default:
          $ref: "#/components/responses/Error"
  /api/v1/issue-attachments/{attachmentId}/download-url:
    parameters:
      - $ref: "#/components/parameters/AttachmentId"
    get:
      tags: [Issues]
      operationId: getIssueAttachmentDownloadUrl
      responses:
        "200":
          description: Short-lived attachment download URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadTicket"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/sync/push:
    post:
      tags: [Sync]
      operationId: pushOperations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPush"
      responses:
        "200":
          description: Per-operation outcomes
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/SyncPushResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}/changes:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: cursor
        in: query
        schema:
          type: integer
          minimum: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
    get:
      tags: [Sync]
      operationId: pullChanges
      responses:
        "200":
          description: Ordered change stream page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePage"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}/sync-bootstrap:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Sync]
      operationId: bootstrapProject
      responses:
        "200":
          description: Full remote project snapshot and starting cursor
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImageId:
      name: imageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IssueId:
      name: issueId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Current integer revision expected by the writer
      schema:
        type: string
  responses:
    Error:
      description: Structured API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    ProjectRole:
      type: string
      enum: [owner, manager, annotator, reviewer, viewer]
    Project:
      type: object
      required: [id, name, mode, revision]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, "null"]
        mode:
          type: string
          enum: [cloud_linked, mirrored]
        revision:
          type: integer
          format: int64
        role:
          $ref: "#/components/schemas/ProjectRole"
    ProjectWrite:
      type: object
      required: [name, mode]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: [string, "null"]
        mode:
          type: string
          enum: [cloud_linked, mirrored]
    ProjectMember:
      type: object
      required: [userId, role]
      properties:
        userId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ProjectRole"
    Asset:
      type: object
      required:
        - id
        - fileName
        - contentHash
        - mimeType
        - width
        - height
        - byteSize
        - status
        - revision
      properties:
        id:
          type: string
          format: uuid
        clientKey:
          type: [string, "null"]
        fileName:
          type: string
        objectKey:
          type: string
        contentHash:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"
        mimeType:
          type: string
        width:
          type: integer
        height:
          type: integer
        byteSize:
          type: integer
          format: int64
        split:
          type: string
        status:
          type: string
          enum: [uploading, ready, failed]
        revision:
          type: integer
          format: int64
    AssetUploadRequest:
      type: object
      required: [fileName, contentHash, mimeType, width, height, byteSize]
      properties:
        clientKey:
          type: [string, "null"]
        fileName:
          type: string
        contentHash:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"
        mimeType:
          type: string
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        byteSize:
          type: integer
          minimum: 1
        split:
          type: string
          default: train
    AttachmentUploadRequest:
      type: object
      required: [fileName, contentHash, mimeType, byteSize]
      properties:
        clientKey:
          type: [string, "null"]
        fileName:
          type: string
        contentHash:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"
        mimeType:
          type: string
        byteSize:
          type: integer
          minimum: 1
    UploadSession:
      type: object
      required: [method, expiresIn, alreadyComplete]
      properties:
        assetId:
          type: string
          format: uuid
        attachmentId:
          type: string
          format: uuid
        objectKey:
          type: string
        uploadUrl:
          type: [string, "null"]
          format: uri
        method:
          type: string
          const: PUT
        expiresIn:
          type: integer
        alreadyComplete:
          type: boolean
    DownloadTicket:
      type: object
      required: [downloadUrl, fileName, contentHash, mimeType, byteSize, expiresIn]
      properties:
        assetId:
          type: string
          format: uuid
        attachmentId:
          type: string
          format: uuid
        downloadUrl:
          type: string
          format: uri
        fileName:
          type: string
        contentHash:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"
        mimeType:
          type: string
        byteSize:
          type: integer
          format: int64
        expiresIn:
          type: integer
    AnnotationWrite:
      type: object
      required: [objects, operationId]
      properties:
        operationId:
          type: string
        baseRevision:
          type: integer
          format: int64
        objects:
          type: array
          items:
            type: object
            additionalProperties: true
    SyncPush:
      type: object
      required: [deviceId, projectId, operations]
      properties:
        deviceId:
          type: string
        projectId:
          type: string
          format: uuid
        operations:
          type: array
          maxItems: 500
          items:
            type: object
            required: [operationId, entityType, entityId, operation, payload]
            properties:
              operationId:
                type: string
              entityType:
                type: string
              entityId:
                type: string
              operation:
                type: string
              baseRevision:
                type: [integer, "null"]
              payload:
                type: object
                additionalProperties: true
    SyncPushResult:
      type: object
      required: [operationId, status]
      properties:
        operationId:
          type: string
        status:
          type: string
          enum: [applied, duplicate, conflict, rejected, retryable]
        serverRevision:
          type: [integer, "null"]
        remotePayload:
          type: [object, "null"]
          additionalProperties: true
        error:
          type: [string, "null"]
    ChangePage:
      type: object
      required: [nextCursor, hasMore, changes]
      properties:
        nextCursor:
          type: string
        hasMore:
          type: boolean
        changes:
          type: array
          items:
            type: object
            required: [sequence, entityType, entityId, operation, revision, payload]
            properties:
              sequence:
                type: integer
                format: int64
              entityType:
                type: string
              entityId:
                type: string
              operation:
                type: string
              revision:
                type: integer
                format: int64
              payload:
                type: object
                additionalProperties: true
              createdAt:
                type: string
                format: date-time
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: [string, "null"]
        details:
          type: [object, "null"]
          additionalProperties: true
