name: Version metadata
on:
  push:
    branches: ["main", "chore/version-management-20261012"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/version_manager.py check
      - run: python scripts/test_versioning.py
      - run: python tests/test_version_manager.py
